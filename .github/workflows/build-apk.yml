# 简易记账 · 云端构建 APK
#
# 用法（不用装任何开发环境）：
#   1) 在 GitHub 新建仓库（建议 Public：Actions 免费不限时长，Release 附件手机可直接下）
#   2) 把本项目【SimpleLedger 目录里的内容】作为仓库根目录推上去
#      （仓库根必须能看到 settings.gradle.kts、app/、gradle/、build.gradle.kts）
#   3) push 到 main 后自动构建，约 4-6 分钟
#   4) 出包后两种下载方式：
#      · 手机：仓库首页右侧 Releases → 点最新版本 → 下 app-debug.apk
#      · 电脑：Actions → 本次运行 → 底部 Artifacts（zip，解压得到 apk）
#
# 如果失败：运行页顶部的 【Summary】 会直接列出编译错误（本文件最后一个 step 负责提取），
#          把那段贴给开发者即可，不需要在几千行日志里翻。
#
# 注意：CI 每次都用新的 debug 签名，因此【新包不能覆盖安装旧包】，覆盖前先在手机上卸载旧版。

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目没有 gradle-wrapper.jar，交给官方 action 注入 Gradle 8.7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ---- 编译：允许失败，以便后续步骤把错误提取出来 ----
      - name: Build debug APK
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      # ---- 把真正的错误写进 Summary（运行页顶部就能看到）----
      - name: Summarize build errors
        if: steps.compile.outcome == 'failure'
        run: |
          {
            echo '## 构建失败 —— 请把下面这段发给开发者'
            echo ''
            echo '```text'
            echo '===== Kotlin 编译错误 (e: ...) ====='
            grep -E '^e: ' gradle-build.log | head -40 || true
            echo ''
            echo '===== Gradle / 配置错误 ====='
            grep -E '^(FAILURE:|Caused by:|\* What went wrong:|> Task .* FAILED|Execution failed|Unresolved reference|error:)' gradle-build.log | head -40 || true
            echo ''
            echo '===== 第一处 FAILURE 的上下文 ====='
            grep -n -B 2 -A 18 'FAILURE: Build' gradle-build.log | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::error::构建失败，错误已提取到本页 Summary'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail job when compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

      # ---- 以下只在编译成功后执行 ----
      - name: Upload APK artifact
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jianyi-jizhang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: steps.compile.outcome == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 简易记账 v1.0.${{ github.run_number }}
          body: |
            云端自动构建的 debug APK，可直接安装到手机。

            安装提示：
            - 首次需在手机上允许该来源「安装未知应用」
            - 若手机上已有旧版本，请先卸载再装（CI 每次签名不同）
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        if: steps.compile.outcome == 'success'
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

# ============================================================================
# 想固定签名（新包可覆盖安装、也能发给别人升级）时：
#   1) keytool -genkeypair -v -keystore ledger.jks -alias ledger \
#        -keyalg RSA -keysize 2048 -validity 10000
#   2) 转 base64： PowerShell:
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("ledger.jks")) | Set-Clipboard
#   3) 仓库 Settings → Secrets and variables → Actions 新增：
#        KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   4) app/build.gradle.kts 加 signingConfigs（从环境变量读），
#      并把上面的 assembleDebug 换成 assembleRelease。
# ============================================================================
