# 简易记账 · 云端构建 APK
#
# 用法（不用装任何开发环境）：
#   1) 在 GitHub 新建仓库（建议 Public：Actions 免费不限时长，Release 附件手机可直接下）
#   2) 把本项目【SimpleLedger 目录里的内容】作为仓库根目录推上去
#   3) push 到 main 后自动构建，约 4-6 分钟
#   4) 下载：
#      · 手机：仓库首页右侧 Releases → 点最新版本 → app-debug.apk
#      · 电脑：Actions → 本次运行 → Artifacts（zip，解压得到 apk）
#
# 两个任务相互独立、并行执行：
#   [构建 APK] 只负责出包  ← 这才是你要的；它绿了就一定有 APK
#   [单元测试] 只负责质量  ← 它红了不影响 APK，可以照常下载安装
#
# 失败时不用翻日志：运行页顶部的 Summary 会直接列出编译/测试错误。
#
# 注意：CI 每次都用新的 debug 签名，因此【新包不能覆盖安装旧包】，覆盖前先在手机上卸载旧版。

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  # ==========================================================================
  # 任务一：出 APK（唯一目标）
  # ==========================================================================
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本项目没有 gradle-wrapper.jar，交给官方 action 注入 Gradle 8.7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Summarize build errors
        if: steps.compile.outcome == 'failure'
        run: |
          {
            echo '## 构建失败 —— 请把下面这段发给开发者'
            echo ''
            echo '```text'
            echo '===== Kotlin 编译错误 (e: ...) ====='
            grep -E '^e: ' gradle-build.log | head -40 || true
            echo ''
            echo '===== Gradle / 配置错误 ====='
            grep -E '^(FAILURE:|Caused by:|\* What went wrong:|> Task .* FAILED|Execution failed|Unresolved reference|error:)' gradle-build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::构建失败，错误已提取到本页 Summary'

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail job when compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jianyi-jizhang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: steps.compile.outcome == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 简易记账 v1.0.${{ github.run_number }}
          body: |
            云端自动构建的 debug APK，可直接安装到手机。

            安装提示：
            - 首次需在手机上允许该来源「安装未知应用」
            - 若手机上已有旧版本，请先卸载再装（CI 每次签名不同）
          files: app/build/outputs/apk/debug/app-debug.apk

  # ==========================================================================
  # 任务二：单元测试（与出包并行，失败不影响 APK）
  # ==========================================================================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      - name: Summarize test problems
        if: steps.tests.outcome == 'failure'
        run: |
          {
            echo '## 单元测试未通过（不影响 APK 下载）—— 请把下面这段发给开发者'
            echo ''
            echo '```text'
            echo '===== 测试代码编译错误 (e: ...) ====='
            grep -E '^e: ' gradle-test.log | head -40 || true
            echo ''
            echo '===== 失败/异常 ====='
            grep -E '^(FAILURE:|> Task .* FAILED|.*FAILED$|[0-9]+ tests? completed.*failed)' gradle-test.log | head -30 || true
            grep -E '(expected:|AssertionError|ComparisonFailure)' gradle-test.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::单元测试未通过；APK 已在 [构建 APK] 任务中产出，可正常下载安装'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-log
          path: gradle-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail job when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

# ============================================================================
# 想固定签名（新包可覆盖安装、也能发给别人升级）时：
#   1) keytool -genkeypair -v -keystore ledger.jks -alias ledger \
#        -keyalg RSA -keysize 2048 -validity 10000
#   2) 转 base64： PowerShell:
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("ledger.jks")) | Set-Clipboard
#   3) 仓库 Settings → Secrets and variables → Actions 新增：
#        KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   4) app/build.gradle.kts 加 signingConfigs（从环境变量读），
#      并把上面的 assembleDebug 换成 assembleRelease。
# ============================================================================
