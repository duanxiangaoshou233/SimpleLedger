# 简易记账 · 云端构建 APK
#
# 用法（不用装任何开发环境）：
#   1) 在 GitHub 新建一个仓库（建议 Public：Actions 免费不限时长，且 Release 附件免登录可下）
#   2) 把本项目【SimpleLedger 目录里的内容】作为仓库根目录推上去
#      （仓库根必须能看到 settings.gradle.kts、app/、gradle/、build.gradle.kts）
#   3) push 到 main 分支后自动开始构建，约 3-6 分钟
#   4) 出包后两种下载方式：
#      · 电脑：该仓库 Actions → 选本次运行 → 底部 Artifacts 下载 zip（解压得到 apk）
#      · 手机：该仓库首页右侧 Releases → 点最新版本 → 直接下 app-debug.apk 并安装
#
# 注意：CI 每次都在全新机器上生成 debug 签名，因此【用新 APK 覆盖安装旧版会失败】，
#       覆盖前请先在手机上卸载旧版。想彻底解决，见文件末尾的"固定签名"说明。

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 同一分支的重复推送取消前一次，避免排队
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目里没有 gradle-wrapper.jar，所以交给官方 action 注入 Gradle 8.7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ---- 先出包：保证任何情况下都有可安装的产物 ----
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jianyi-jizhang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---- 挂到 Release：手机浏览器点一下就能下 ----
      - name: Attach APK to Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 简易记账 v1.0.${{ github.run_number }}
          body: |
            云端自动构建的 debug APK，可直接安装到手机。

            安装提示：
            - 首次需在手机上允许该来源「安装未知应用」
            - 若手机上已有旧版本，请先卸载再装（CI 每次签名不同）
          files: app/build/outputs/apk/debug/app-debug.apk

      # ---- 单测放在最后：即使某个用例不通过，上面的 APK 也已经产出 ----
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

# ============================================================================
# 想固定签名（让新包能覆盖安装旧包、也能给别人升级）时，按下面做：
#
#   1) 本地/Android Studio 生成一个 keystore（jks），执行：
#        keytool -genkeypair -v -keystore ledger.jks -alias ledger \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2) 转成 base64（Windows PowerShell）：
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("ledger.jks")) | Set-Clipboard
#   3) 仓库 Settings → Secrets and variables → Actions 新增：
#        KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   4) 在 app/build.gradle.kts 里加 signingConfigs（从环境变量读），
#      并在 release buildType 里引用它 + 把下面这步的 assembleDebug 换成 assembleRelease。
# ============================================================================
